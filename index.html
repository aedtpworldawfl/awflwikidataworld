<style>
:root{--pink:#ff6fa8;--pink-d:#e0457f;--pink-l:#ffd6e8;--lav:#efe9ff;--ink:#3b2a35;--mut:#8a7683;--r:16px;--r2:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff0f7 0%,#f4f0ff 100%) fixed;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pink-d)}

/* header */
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#fff;border:2px solid var(--pink-l);border-top:0;border-radius:0 0 var(--r) var(--r);position:sticky;top:0;z-index:30;box-shadow:0 6px 18px rgba(255,111,168,.12)}
.top img{width:40px;height:40px;border-radius:var(--r2);flex:none;cursor:pointer}
.top h1{font-size:1.05rem;margin:0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.top input{flex:1;min-width:0;padding:10px 14px;border:2px solid var(--pink-l);border-radius:var(--r2);outline:0;background:#fff8fc}
.top input:focus{border-color:var(--pink)}

/* buttons */
.btn,.chip{border:2px solid var(--pink-l);background:#fff;border-radius:var(--r2);padding:8px 12px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover,.chip:hover{border-color:var(--pink);transform:translateY(-1px)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.danger{background:#ff5a7a;border-color:#ff5a7a;color:#fff}
.btn.ghost{background:transparent}
.chip{border-radius:999px;padding:6px 14px}
.chip.active{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.chip.file.active{background:var(--lav);border-color:#9b7cff;color:#4a2fb0}

main.wrap{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:16px}

/* visitor */
.crumb{font-size:.92rem;color:var(--mut);margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);display:block}
a.card:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,111,168,.18)}
.card.folder{text-align:center;font-size:1.05rem}
.card.folder .em{font-size:2rem;display:block;margin-bottom:6px}
.card small{display:block;color:var(--mut);margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.doc{background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);padding:22px;line-height:1.65;overflow-wrap:anywhere}
.doc img{max-width:100%}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

/* admin */
.panel{background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel .lbl{font-size:.8rem;color:var(--mut);margin-right:2px}
#toolbar.off button:not(#saveBtn):not(#srcBtn),#toolbar.off label{opacity:.35;pointer-events:none}
#toolbar label{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--pink-l);border-radius:var(--r2);padding:4px 8px;background:#fff;cursor:pointer}
#toolbar input[type=color]{width:28px;height:26px;border:0;padding:0;background:none;cursor:pointer}
#imgPanel{display:flex;gap:10px;overflow-x:auto;padding:10px;background:#fff;border:2px dashed var(--pink-l);border-radius:var(--r);margin-bottom:10px;align-items:center}
.thumb{position:relative;flex:none;width:100px;height:100px}
.thumb img{width:100px;height:100px;object-fit:cover;border-radius:var(--r2);cursor:pointer;border:2px solid var(--pink-l);display:block}
.thumb img:hover{border-color:var(--pink)}
.thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#ff5a7a;color:#fff;cursor:pointer;line-height:22px;padding:0}
.split{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:960px){.split{grid-template-columns:1fr 1fr}}
.pane{background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);overflow:hidden;min-height:46vh}
@media(min-width:960px){.pane{height:60vh}}
#editor{background:#fff;color:#000;padding:18px;height:100%;min-height:46vh;overflow:auto;outline:0;line-height:1.6;overflow-wrap:anywhere}
#editor[contenteditable=false]{color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center}
#editor img{width:250px!important;height:auto;border-radius:12px}
#src{width:100%;height:100%;min-height:46vh;border:0;outline:0;padding:18px;background:#fff;color:#000;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:none}
#preview{width:100%;height:100%;min-height:46vh;border:0;background:#fff;display:block}
.status{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:10px;background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);padding:8px 14px;font-size:.88rem}
.status .ok{color:#1b9e5a}.status .err{color:#d6204a}.status .warn{color:#b36b00}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(59,42,53,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal form{width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 10px}
.modal label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:10px}
.modal input,.modal select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:2px solid var(--pink-l);border-radius:var(--r2);outline:0;color:var(--ink);background:#fff}
.modal input:focus,.modal select:focus{border-color:var(--pink)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r2);box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw}
#toast div.err{background:#d6204a}

footer.site{margin:20px 16px 16px;background:#fff;border:2px solid var(--pink-l);color:var(--mut);font-size:.9rem}
</style>
</head>
<body>

<header class="top">
  <img id="logo" src="https://aedtpworld.com/icons/aedtpworld.png" alt="logo" title="Home">
  <h1 id="sitename">AWFLWIKIDATAWORLD</h1>
  <input id="search" type="search" placeholder="🔎 Search…" autocomplete="off">
  <button class="btn" id="loginBtn" title="Admin login">🔐</button>
</header>

<main class="wrap">
  <!-- visitor -->
  <section id="visitor"></section>

  <!-- admin -->
  <section id="admin" hidden>
    <div class="panel" id="sys">
      <span class="lbl">⚙️ System</span>
      <button class="btn" data-a="newFolder">📁＋ Folder</button>
      <button class="btn" data-a="renameFolder">✏️ Folder</button>
      <button class="btn" data-a="deleteFolder">🗑️ Folder</button>
      <button class="btn primary" data-a="newFile">📄＋ Page</button>
      <button class="btn" data-a="renameFile">✏️ Page</button>
      <button class="btn" data-a="moveFile">📦 Move</button>
      <button class="btn" data-a="deleteFile">🗑️ Page</button>
      <button class="btn" data-a="rebuild" title="Rebuild sitemap.xml, llms.txt, robots.txt">🗺️ Rebuild SEO</button>
      <button class="btn ghost" data-a="logout">🚪 Logout</button>
    </div>
    <div class="panel" id="folderRow"></div>
    <div class="panel" id="fileRow"></div>

    <div class="panel off" id="toolbar">
      <button class="btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="btn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button class="btn" data-cmd="underline" title="Underline"><u>U</u></button>
      <button class="btn" data-cmd="h1">H1</button>
      <button class="btn" data-cmd="h2">H2</button>
      <button class="btn" data-cmd="h3">H3</button>
      <button class="btn" data-cmd="link" title="Link">🔗</button>
      <button class="btn" data-cmd="ul" title="Bullet list">• List</button>
      <button class="btn" data-cmd="ol" title="Numbered list">1. List</button>
      <button class="btn" id="imgBtn" title="Images">🖼️ Image</button>
      <label title="Text color (selected text, or pick then type)">A <input type="color" id="fg" value="#000000"></label>
      <label title="Highlight / background color (selected text, or pick then type)">🖍 <input type="color" id="bg" value="#ffffff"></label>
      <button class="btn" data-cmd="clear" title="Clear formatting">🧹</button>
      <button class="btn" id="srcBtn" title="Toggle HTML source">&lt;/&gt;</button>
      <button class="btn primary" id="saveBtn" title="Save now (Ctrl+S)">💾 Save</button>
    </div>

    <div id="imgPanel" hidden></div>
    <input type="file" id="imgFile" accept=".jpg,.jpeg,.png,.webp,.gif,image/*" hidden>

    <div class="split">
      <div class="pane">
        <div id="editor" contenteditable="false" spellcheck="true"></div>
        <textarea id="src" hidden spellcheck="false"></textarea>
      </div>
      <div class="pane"><iframe id="preview" title="Preview" sandbox="allow-popups"></iframe></div>
    </div>

    <div class="status"><span id="status">Ready</span><span id="adminCrumb"></span></div>
  </section>
</main>

<footer class="site" id="siteFooter" style="border-radius:16px; text-align:center; padding:20px;">AWFLWIKIDATAWORLD © AEDTPWORLD | AEDTP WORLD FREE LICENSE (AWFL)</footer>
<div id="toast"></div>

<script>
(()=>{
'use strict';

/* ===== settings ===== */
const SITE = 'https://aedtpworldawfl.github.io/awflwikidataworld';
// URL of your Render service. You can also change it from the login box (saved in this browser).
const DEFAULT_API = 'https://awflwikidataworld-api.onrender.com/api.php';
const IMG_STYLE = 'width:250px !important;height:auto;border-radius:12px';

/* ===== state ===== */
let CFG = {sitename:'AWFLWIKIDATAWORLD', metatitle:'AWFLWIKIDATAWORLD PROJECT DOCUMENTATION', icon:'https://aedtpworld.com/icons/aedtpworld.png'};
let tree = {folders:{}, images:[]};
let admin = null;
let active = null;              // active folder
let cur = null;                 // {folder,name,kind}
let mode = 'rich';              // rich | source
let lastSaved = '';
let inflight = null;
let savedRange = null;
const imgCache = {};            // name -> dataURL for freshly uploaded images

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pname = n => n.replace(/\.[^.]+$/, '');
const kindOf = n => /\.html$/i.test(n) ? 'html' : 'text';
const ci = (a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'});
const hms = () => new Date().toTimeString().slice(0,8);
const apiUrl = () => localStorage.getItem('awfl_api') || DEFAULT_API;

/* ===== ui helpers ===== */
function toast(msg, type){
  const d = document.createElement('div'); if(type) d.className = type; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(()=>d.remove(), 3800);
}
function ask({title, text='', fields=[], ok='OK', danger=false}){
  return new Promise(res=>{
    const w = document.createElement('div'); w.className = 'modal';
    w.innerHTML = `<form class="card"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${fields.map(f=>`<label>${esc(f.label)}${
      f.type==='select' ? `<select name="${f.name}">${f.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`
      : `<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" autocomplete="off">`}</label>`).join('')}
      <div class="row"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn ${danger?'danger':'primary'}">${esc(ok)}</button></div></form>`;
    document.body.appendChild(w);
    const form = w.querySelector('form');
    const close = v => { w.remove(); res(v); };
    form.onsubmit = e => { e.preventDefault(); const o = {}; new FormData(form).forEach((v,k)=>o[k]=v); close(o); };
    w.querySelector('[data-x]').onclick = () => close(null);
    w.addEventListener('keydown', e => { if(e.key==='Escape') close(null); });
    w.addEventListener('mousedown', e => { if(e.target===w) close(null); });
    const first = form.querySelector('input,select'); (first || form.querySelector('.btn:not(.ghost)')).focus();
  });
}
function setStatus(t, cls){ const s = $('#status'); s.textContent = t; s.className = cls||''; }

/* ===== data ===== */
async function getJSON(url){
  const r = await fetch(url + (url.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function normTree(t){
  t = t || {};
  let f = t.folders; if(!f || Array.isArray(f)) f = {};
  return {folders:f, images:Array.isArray(t.images)?t.images:[]};
}
async function loadTree(){ try{ tree = normTree(await getJSON('tree.json')); }catch(e){ tree = normTree(); } }

async function api(action, data={}){
  if(!admin) throw new Error('Not logged in');
  let r;
  try{
    r = await fetch(apiUrl(), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...data, action, username:admin.u, password:admin.p})});
  }catch(e){ throw new Error('Writer API not reachable (is the Render service awake and the API URL correct?)'); }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Bad response from writer (' + r.status + ')'); }
  if(!j.ok) throw new Error(j.error || 'Request failed');
  if(j.tree) tree = normTree(j.tree);
  return j;
}

/* ===== branding ===== */
function applyBranding(){
  $('#logo').src = CFG.icon; $('#favicon').href = CFG.icon;
  $('#sitename').textContent = CFG.sitename;
  document.title = CFG.metatitle;
  $('#siteFooter').textContent = CFG.sitename + ' © AEDTPWORLD | AEDTP WORLD FREE LICENSE (AWFL)';
}

/* ===== visitor view ===== */
const pagesOf = f => (tree.folders[f]||[]).filter(n => /\.html$/i.test(n));
const hashParts = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
const lnk = (...p) => '#/' + p.map(encodeURIComponent).join('/');

function route(){
  if(admin) return;
  const parts = hashParts(), q = $('#search').value.trim().toLowerCase(), v = $('#visitor');
  if(!parts.length) v.innerHTML = viewHome(q);
  else if(parts.length === 1) v.innerHTML = viewFolder(parts[0], q);
  else viewPage(parts[0], parts[1]);
  if(parts.length < 2) document.title = CFG.metatitle;
}
function pageRow(f, p){ return `<a class="card" href="${lnk(f,p)}">📄 <b>${esc(pname(p))}</b><small>${esc(f)}</small></a>`; }
function viewHome(q){
  const names = Object.keys(tree.folders).sort(ci);
  let h = '<div class="crumb">🏠 Home</div>';
  if(q){
    const fs = names.filter(f => f.includes(q));
    const ps = []; names.forEach(f => pagesOf(f).forEach(p => { if((f+' '+pname(p)).toLowerCase().includes(q)) ps.push([f,p]); }));
    h += `<h2>Search “${esc(q)}”</h2>`;
    if(fs.length) h += `<div class="grid">${fs.map(folderCard).join('')}</div><br>`;
    if(ps.length) h += `<div class="list">${ps.map(([f,p])=>pageRow(f,p)).join('')}</div>`;
    if(!fs.length && !ps.length) h += '<div class="empty">Nothing found 🌸</div>';
    return h;
  }
  return h + (names.length ? `<div class="grid">${names.map(folderCard).join('')}</div>` : '<div class="empty">No folders yet 🌸</div>');
}
function folderCard(f){ const n = pagesOf(f).length; return `<a class="card folder" href="${lnk(f)}"><span class="em">📁</span><b>${esc(f)}</b><small>${n} page${n===1?'':'s'}</small></a>`; }
function viewFolder(f, q){
  if(!tree.folders[f]) return `<div class="crumb"><a href="#/">Home</a> › ${esc(f)}</div><div class="empty">Folder not found 🙈</div>`;
  const ps = pagesOf(f).filter(p => !q || pname(p).toLowerCase().includes(q)).sort(ci);
  return `<div class="crumb"><a href="#/">Home</a> › ${esc(f)}</div><h2>📁 ${esc(f)}</h2>` +
    (ps.length ? `<div class="list">${ps.map(p=>pageRow(f,p)).join('')}</div>` : '<div class="empty">No pages here yet 🌸</div>');
}
async function viewPage(f, file){
  const v = $('#visitor'), name = pname(file);
  const crumb = `<div class="crumb"><a href="#/">Home</a> › <a href="${lnk(f)}">${esc(f)}</a> › ${esc(name)}</div>`;
  v.innerHTML = crumb + '<div class="doc">Loading…</div>';
  try{
    const r = await fetch(encodeURIComponent(f) + '/' + encodeURIComponent(file) + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const m = doc.querySelector('main#content') || doc.body;
    m.querySelectorAll('script').forEach(s => s.remove());
    m.querySelectorAll('img').forEach(i => { const s = i.getAttribute('src')||''; if(s.startsWith('../')) i.setAttribute('src', s.slice(3)); });
    v.innerHTML = crumb + `<article class="doc">${m.innerHTML}</article><p class="crumb"><a target="_blank" rel="noopener" href="${encodeURIComponent(f)}/${encodeURIComponent(file)}">Open standalone page ↗</a></p>`;
    document.title = `${name} - ${f} | ${CFG.metatitle}`;
    scrollTo(0,0);
  }catch(e){ v.innerHTML = crumb + '<div class="empty">Page not found 🙈</div>'; }
}

/* ===== login ===== */
async function login(){
  const r = await ask({title:'Admin login 🔐', ok:'Login', fields:[
    {name:'u', label:'Username'}, {name:'p', label:'Password', type:'password'},
    {name:'api', label:'Writer API URL (Render)', value:apiUrl()}]});
  if(!r) return;
  try{
    const c = await getJSON('config.json');
    if(r.u !== c.username || r.p !== c.password) return toast('Wrong username or password', 'err');
  }catch(e){ return toast('Could not read config.json', 'err'); }
  if(r.api && r.api.trim()) localStorage.setItem('awfl_api', r.api.trim());
  admin = {u:r.u, p:r.p};
  sessionStorage.setItem('awfl_admin', JSON.stringify(admin));
  enterAdmin();
  api('login').catch(e => toast('⚠ ' + e.message, 'err'));   // also wakes a sleeping Render instance
}
function enterAdmin(){
  $('#visitor').hidden = true; $('#admin').hidden = false; $('#loginBtn').hidden = true;
  showEmpty(); afterTree();
}
async function logout(){
  if(cur && !(await flush())) { if(!confirm('Unsaved changes could not be saved. Log out anyway?')) return; }
  admin = null; cur = null; sessionStorage.removeItem('awfl_admin');
  $('#admin').hidden = true; $('#visitor').hidden = false; $('#loginBtn').hidden = false;
  route();
}

/* ===== explorer ===== */
function afterTree(){
  if(active && !tree.folders[active]) active = null;
  renderExplorer(); renderImgs(); setCrumb();
}
function renderExplorer(){
  const q = $('#search').value.trim().toLowerCase();
  const names = Object.keys(tree.folders).sort(ci)
    .filter(f => !q || f.includes(q) || tree.folders[f].some(n => n.toLowerCase().includes(q)));
  $('#folderRow').innerHTML = '<span class="lbl">📂 Path</span>' +
    (names.map(f => `<button class="chip ${f===active?'active':''}" data-folder="${esc(f)}">📁 ${esc(f)}</button>`).join('') || '<span class="lbl">no folders yet</span>');
  let fh = '<span class="lbl">📄 Pages</span>';
  if(active){
    const fl = (tree.folders[active]||[]).filter(n => !/^(index\.html|config\.json)$/i.test(n)).filter(n => !q || n.toLowerCase().includes(q)).sort(ci);
    fh += fl.map(n => `<button class="chip file ${cur&&cur.folder===active&&cur.name===n?'active':''}" data-file="${esc(n)}">${/\.html$/i.test(n)?'📄':'📝'} ${esc(n)}</button>`).join('') || '<span class="lbl">empty — use 📄＋ Page</span>';
  } else fh += '<span class="lbl">click a folder to make it ACTIVE</span>';
  $('#fileRow').innerHTML = fh;
}
function setCrumb(){
  $('#adminCrumb').textContent = cur ? `Home › ${cur.folder} › ${pname(cur.name)}` : (active ? `Home › ${active}` : 'Home');
}
$('#folderRow').addEventListener('click', e => { const b = e.target.closest('[data-folder]'); if(b){ active = b.dataset.folder; renderExplorer(); setCrumb(); } });
$('#fileRow').addEventListener('click', e => { const b = e.target.closest('[data-file]'); if(b) openFile(active, b.dataset.file).catch(err => toast(err.message,'err')); });

/* ===== editor core ===== */
const editor = $('#editor'), src = $('#src'), preview = $('#preview');

function showEmpty(){
  cur = null; lastSaved = '';
  editor.contentEditable = 'false'; editor.innerHTML = 'Pick a page in the explorer ☝️ or create a new one 📄＋';
  editor.hidden = false; src.hidden = true; src.value = ''; mode = 'rich';
  $('#toolbar').classList.add('off'); preview.srcdoc = ''; setStatus('Ready'); setCrumb(); renderExplorer();
}
function normalizeImgs(){ editor.querySelectorAll('img').forEach(i => { if(i.getAttribute('style') !== IMG_STYLE) i.setAttribute('style', IMG_STYLE); }); }
function getContent(){
  if(!cur) return '';
  if(cur.kind === 'html' && mode === 'rich'){ normalizeImgs(); return editor.innerHTML; }
  return src.value;
}
function setMode(m){
  mode = m;
  const rich = m === 'rich';
  editor.hidden = !rich; src.hidden = rich;
  editor.contentEditable = rich ? 'true' : 'false';
  $('#toolbar').classList.toggle('off', !rich);
}
async function openFile(folder, name){
  if(cur && !(await flush())) return;
  setStatus('Opening…');
  const j = await api('read', {path: folder + '/' + name});
  cur = {folder, name, kind: j.kind}; active = folder;
  if(j.kind === 'html'){ editor.innerHTML = j.content; src.value = j.content; setMode('rich'); }
  else { editor.innerHTML = ''; src.value = j.content; setMode('source'); $('#toolbar').classList.add('off'); }
  lastSaved = getContent();
  renderExplorer(); setCrumb(); updatePreview(); setStatus('Opened ' + name + ' — saved ✓', 'ok');
}
let pvTimer;
function onEdit(){
  if(!cur) return;
  setStatus('Unsaved changes…', 'warn');
  clearTimeout(pvTimer); pvTimer = setTimeout(updatePreview, 250);
}
function updatePreview(){
  if(!cur){ preview.srcdoc = ''; return; }
  let c = getContent();
  if(cur.kind === 'html'){
    for(const [n,d] of Object.entries(imgCache)) c = c.split(SITE + '/images/' + encodeURIComponent(n)).join(d);
    preview.srcdoc = `<!doctype html><meta charset="utf-8"><base href="${SITE}/${encodeURIComponent(cur.folder)}/">` +
      `<body style="margin:0;background:#fff;color:#000;font-family:Segoe UI,system-ui,sans-serif"><main style="padding:20px;line-height:1.6;overflow-wrap:anywhere">${c}</main>`;
  } else {
    let t = c; if(/\.json$/i.test(cur.name)){ try{ t = JSON.stringify(JSON.parse(c), null, 2); }catch(e){} }
    preview.srcdoc = `<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff;color:#000"><pre style="margin:0;padding:20px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace">${esc(t)}</pre>`;
  }
}
const isDirty = () => !!cur && getContent() !== lastSaved;
function saveNow(){
  if(inflight) return inflight;
  inflight = doSave().finally(() => { inflight = null; });
  return inflight;
}
async function doSave(){
  if(!cur) return true;
  const content = getContent();
  if(content === lastSaved){ setStatus('Saved ✓ ' + hms(), 'ok'); return true; }
  setStatus('Saving…');
  try{
    await api('save', {folder: cur.folder, name: cur.name, content});
    lastSaved = content;
    afterTree();
    let warn = '';
    if(/\.json$/i.test(cur.name)){ try{ JSON.parse(content); }catch(e){ warn = ' ⚠ invalid JSON'; } }
    setStatus('Saved ✓ ' + hms() + warn, warn ? 'warn' : 'ok');
    return true;
  }catch(e){ setStatus('⚠ Save failed: ' + e.message, 'err'); return false; }
}
async function flush(){
  for(let i = 0; i < 3 && isDirty(); i++){ if(!(await saveNow())) return false; }
  return !isDirty();
}

editor.addEventListener('input', onEdit);
src.addEventListener('input', onEdit);
setInterval(() => { if(admin && cur && !inflight && isDirty()) saveNow(); }, 10000);   // auto-save every 10s
addEventListener('beforeunload', e => { if(admin && isDirty()){ e.preventDefault(); e.returnValue = ''; } });
addEventListener('keydown', e => { if(admin && cur && (e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); } });

/* ===== toolbar ===== */
document.addEventListener('selectionchange', () => {
  const s = getSelection();
  if(s.rangeCount && editor.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
});
function restore(){
  editor.focus();
  if(savedRange){ const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); }
}
function exec(cmd, val){ restore(); document.execCommand('styleWithCSS', false, true); document.execCommand(cmd, false, val); onEdit(); }
function insertHtml(html){
  if(mode === 'rich'){ restore(); document.execCommand('insertHTML', false, html); onEdit(); }
  else { const a = src.selectionStart, b = src.selectionEnd; src.setRangeText(html, a, b, 'end'); onEdit(); src.focus(); }
}
$('#toolbar').addEventListener('mousedown', e => { if(e.target.closest('button')) e.preventDefault(); });
$('#toolbar').addEventListener('click', async e => {
  const b = e.target.closest('[data-cmd]'); if(!b || !cur || mode !== 'rich') return;
  const c = b.dataset.cmd;
  if(c === 'bold' || c === 'italic' || c === 'underline') exec(c);
  else if(c === 'h1' || c === 'h2' || c === 'h3') exec('formatBlock', '<' + c + '>');
  else if(c === 'ul') exec('insertUnorderedList');
  else if(c === 'ol') exec('insertOrderedList');
  else if(c === 'clear') exec('removeFormat');
  else if(c === 'link'){
    const r = await ask({title:'Insert link 🔗', ok:'Insert', fields:[{name:'url', label:'URL', value:'https://'}]});
    if(!r || !r.url.trim()) return;
    const url = r.url.trim();
    if(savedRange && savedRange.collapsed) insertHtml(`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`);
    else exec('createLink', url);
  }
});
$('#fg').addEventListener('input', e => { if(cur && mode === 'rich') exec('foreColor', e.target.value); });
$('#bg').addEventListener('input', e => { if(cur && mode === 'rich') exec('hiliteColor', e.target.value); });
$('#saveBtn').onclick = () => { if(cur) saveNow(); else toast('Open a page first'); };
$('#srcBtn').onclick = () => {
  if(!cur || cur.kind !== 'html') return toast('Source view is only for HTML pages');
  if(mode === 'rich'){ src.value = getContent(); setMode('source'); }
  else { editor.innerHTML = src.value; setMode('rich'); }
  updatePreview();
};

/* ===== images ===== */
const imgSrc = n => imgCache[n] || SITE + '/images/' + encodeURIComponent(n);
function renderImgs(){
  $('#imgPanel').innerHTML = `<button class="btn primary" id="upBtn">⬆️ Upload<br><small>max 2MB</small></button>` +
    (tree.images.map(n => `<div class="thumb"><img src="${esc(imgSrc(n))}" data-img="${esc(n)}" alt="${esc(n)}" title="${esc(n)}" loading="lazy"><button class="x" data-del="${esc(n)}" title="Delete image">✕</button></div>`).join('') || '<span class="lbl">No images yet</span>');
}
$('#imgBtn').onclick = () => { const p = $('#imgPanel'); p.hidden = !p.hidden; };
$('#imgPanel').addEventListener('click', async e => {
  if(e.target.closest('#upBtn')) return $('#imgFile').click();
  const d = e.target.closest('[data-del]');
  if(d){
    const r = await ask({title:'Delete image?', text:d.dataset.del, ok:'Delete', danger:true}); if(!r) return;
    try{ await api('delete', {path: 'images/' + d.dataset.del}); afterTree(); toast('Image deleted'); }catch(err){ toast(err.message, 'err'); }
    return;
  }
  const i = e.target.closest('[data-img]');
  if(i){
    if(!cur || cur.kind !== 'html') return toast('Open an HTML page first');
    const n = i.dataset.img;
    insertHtml(`<img src="${SITE}/images/${encodeURIComponent(n)}" alt="${esc(pname(n))}" style="${IMG_STYLE}">`);
  }
});
$('#imgFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  if(!/\.(jpe?g|png|webp|gif)$/i.test(f.name)) return toast('Allowed: jpg, jpeg, png, webp, gif', 'err');
  if(f.size > 2 * 1024 * 1024) return toast('Image is over 2MB', 'err');
  setStatus('Uploading image…');
  try{
    const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
    const j = await api('upload', {name: f.name, data});
    imgCache[j.name] = data; afterTree(); setStatus('Image uploaded ✓ ' + j.name, 'ok');
    toast('Uploaded — it goes live on the site in about a minute');
  }catch(err){ setStatus('⚠ ' + err.message, 'err'); toast(err.message, 'err'); }
});

/* ===== system buttons ===== */
async function act(a){
  try{
    if(a === 'logout') return logout();
    if(a === 'rebuild'){ setStatus('Rebuilding…'); await api('rebuild'); afterTree(); return setStatus('Sitemap, llms.txt and robots.txt rebuilt ✓', 'ok'); }

    if(a === 'newFolder'){
      const r = await ask({title:'New folder 📁', ok:'Create', fields:[{name:'n', label:'Folder name (lowercase, spaces become _)'}]}); if(!r || !r.n.trim()) return;
      const j = await api('mkdir', {folder: r.n}); active = j.folder; afterTree(); return toast('Folder created');
    }
    if(a === 'renameFolder'){
      if(!active) return toast('Click a folder first');
      const r = await ask({title:'Rename folder ✏️', ok:'Rename', fields:[{name:'n', label:'New name', value:active}]}); if(!r || !r.n.trim()) return;
      if(cur && cur.folder === active && !(await flush())) return;
      setStatus('Renaming…');
      const j = await api('rename', {type:'folder', from:active, to:r.n});
      if(cur && cur.folder === active) cur.folder = j.folder;
      active = j.folder; afterTree(); return setStatus('Folder renamed ✓', 'ok');
    }
    if(a === 'deleteFolder'){
      if(!active) return toast('Click a folder first');
      const n = (tree.folders[active]||[]).length;
      const r = await ask({title:'Delete folder?', text:`“${active}” and its ${n} file${n===1?'':'s'} will be removed from GitHub.`, ok:'Delete', danger:true}); if(!r) return;
      const was = active; setStatus('Deleting…');
      await api('delete', {folder: was});
      if(cur && cur.folder === was) showEmpty();
      active = null; afterTree(); return setStatus('Folder deleted ✓', 'ok');
    }
    if(a === 'newFile'){
      if(!active) return toast('Pick or create a folder first — files are created inside the ACTIVE folder');
      const r = await ask({title:`New page in “${active}” 📄`, ok:'Create', fields:[{name:'n', label:'Page name (.html by default; .txt and .json also work)'}]}); if(!r || !r.n.trim()) return;
      if(cur && !(await flush())) return;
      const base = r.n.trim();
      const start = kindOf(base) === 'html' || !/\.(txt|json)$/i.test(base)
        ? `<h1>${esc(pname(base).replace(/_/g,' '))}</h1>\n<p>Start writing here… 🥰</p>`
        : (/\.json$/i.test(base) ? '{\n  \n}\n' : '');
      setStatus('Creating…');
      const j = await api('save', {folder: active, name: base, content: start});
      cur = null; afterTree(); await openFile(j.folder, j.name); return;
    }
    if(a === 'renameFile'){
      if(!cur) return toast('Open a page first');
      const r = await ask({title:'Rename page ✏️', ok:'Rename', fields:[{name:'n', label:'New name', value:cur.name}]}); if(!r || !r.n.trim()) return;
      if(!(await flush())) return;
      setStatus('Renaming…');
      const j = await api('rename', {type:'file', path: cur.folder + '/' + cur.name, newname: r.n});
      cur.name = j.name; cur.kind = kindOf(j.name); afterTree(); return setStatus('Renamed ✓', 'ok');
    }
    if(a === 'moveFile'){
      if(!cur) return toast('Open a page first');
      const others = Object.keys(tree.folders).filter(f => f !== cur.folder).sort(ci);
      if(!others.length) return toast('Create another folder first');
      const r = await ask({title:'Move page 📦', ok:'Move', fields:[{name:'to', label:'Move to folder', type:'select', options:others}]}); if(!r) return;
      if(!(await flush())) return;
      setStatus('Moving…');
      const j = await api('move', {path: cur.folder + '/' + cur.name, to: r.to});
      cur.folder = j.folder; active = j.folder; afterTree(); return setStatus('Moved ✓', 'ok');
    }
    if(a === 'deleteFile'){
      if(!cur) return toast('Open a page first');
      const r = await ask({title:'Delete page?', text:`${cur.folder}/${cur.name} will be removed from GitHub.`, ok:'Delete', danger:true}); if(!r) return;
      const p = cur.folder + '/' + cur.name; setStatus('Deleting…');
      await api('delete', {path: p}); showEmpty(); afterTree(); return setStatus('Page deleted ✓', 'ok');
    }
  }catch(e){ setStatus('⚠ ' + e.message, 'err'); toast(e.message, 'err'); }
}
$('#sys').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(b) act(b.dataset.a); });

/* ===== wiring ===== */
$('#loginBtn').onclick = login;
$('#logo').onclick = () => { if(!admin){ $('#search').value = ''; location.hash = '#/'; route(); } };
$('#search').addEventListener('input', () => {
  if(admin) return renderExplorer();
  if(hashParts().length > 1) location.hash = '#/'; else route();
});
addEventListener('hashchange', route);

(async function init(){
  try{ CFG = Object.assign(CFG, await getJSON('config.json')); }catch(e){}
  applyBranding();
  await loadTree();
  try{ const s = JSON.parse(sessionStorage.getItem('awfl_admin') || 'null'); if(s && s.u) admin = s; }catch(e){}
  if(admin) enterAdmin(); else route();
})();
})();
</script>
