<style>
:root{--pink:#ff6fa8;--pink-d:#e0457f;--pink-l:#ffd6e8;--lav:#efe9ff;--ink:#3b2a35;--mut:#8a7683;--r:16px;--r2:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fff0f7 0%,#f4f0ff 100%) fixed;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pink-d)}

/* header */
.top{display:flex;gap:12px;align-items:center;padding:10px 16px;background:#fff;border:2px solid var(--pink-l);border-top:0;border-radius:0 0 var(--r) var(--r);position:sticky;top:0;z-index:30;box-shadow:0 6px 18px rgba(255,111,168,.12)}
.top img{width:40px;height:40px;border-radius:var(--r2);flex:none;cursor:pointer}
.top h1{font-size:1.05rem;margin:0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.top input{flex:1;min-width:0;padding:10px 14px;border:2px solid var(--pink-l);border-radius:var(--r2);outline:0;background:#fff8fc}
.top input:focus{border-color:var(--pink)}

/* buttons */
.btn,.chip{border:2px solid var(--pink-l);background:#fff;border-radius:var(--r2);padding:8px 12px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover,.chip:hover{border-color:var(--pink);transform:translateY(-1px)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.danger{background:#ff5a7a;border-color:#ff5a7a;color:#fff}
.btn.ghost{background:transparent}
.chip{border-radius:999px;padding:6px 14px}
.chip.active{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:600}
.chip.file.active{background:var(--lav);border-color:#9b7cff;color:#4a2fb0}

main.wrap{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:16px}

/* visitor */
.crumb{font-size:.92rem;color:var(--mut);margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);display:block}
a.card:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,111,168,.18)}
.card.folder{text-align:center;font-size:1.05rem}
.card.folder .em{font-size:2rem;display:block;margin-bottom:6px}
.card small{display:block;color:var(--mut);margin-top:4px}
.list{display:flex;flex-direction:column;gap:10px}
.doc{background:#fff;border:2px solid var(--pink-l);border-radius:var(--r);padding:22px;line-height:1.65;overflow-wrap:anywhere}
.doc img{max-width:100%}
.empty{text-align:center;color:var(--mut);padding:40px 10px}

footer.site{margin:20px 16px 16px;background:#fff;border:2px solid var(--pink-l);color:var(--mut);font-size:.9rem}
</style>
</head>
<body>

<header class="top">
  <img id="logo" src="https://aedtpworld.com/wikiworld/logo/aedtpworld.svg" alt="logo" title="Home">
  <h1 id="sitename">AWFLWIKIDATAWORLD DATABASE</h1>
  <input id="search" type="search" placeholder="🔎 Search…" autocomplete="off">
  <a class="btn" href="https://aedtpworld.byethost12.com/" title="Primary site">🌐</a>
</header>

<main class="wrap"><section id="visitor"></section></main>

<footer class="site" style="border-radius:16px; text-align:center; padding:20px;">AWFLWIKIDATAWORLD DATABASE © AEDTPWORLD | AEDTP WORLD FREE LICENSE (AWFL)</footer>

<script>
(()=>{
'use strict';
/* Static mirror: no PHP, no login. These values were filled in at build time from the Byethost config.php. */
const SERVER = "https://aedtpworld.byethost12.com";
const METATITLE = "AWFLWIKIDATAWORLD DATABASE";

let tree = {folders:{}, images:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pname = n => n.replace(/\.[^.]+$/, '');
const ci = (a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'});

/* folder list: live from Byethost database.json, falling back to the copy this mirror synced */
async function fetchTree(u){
  const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw 0;
  const t = await r.json();
  if(!t || typeof t.folders !== 'object' || Array.isArray(t.folders)) throw 0;
  return t;
}
async function loadTree(){
  let t = null;
  try{ t = await fetchTree(SERVER + '/database.json'); }catch(e){ try{ t = await fetchTree('database.json'); }catch(e2){} }
  tree = {folders:(t && t.folders) || {}, images:(t && t.images) || []};
}

const pagesOf = f => (tree.folders[f]||[]).filter(n => /\.html$/i.test(n));
const hashParts = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
const lnk = (...p) => '#/' + p.map(encodeURIComponent).join('/');

function route(){
  const parts = hashParts(), q = $('#search').value.trim().toLowerCase(), v = $('#visitor');
  if(!parts.length) v.innerHTML = viewHome(q);
  else if(parts.length === 1) v.innerHTML = viewFolder(parts[0], q);
  else viewPage(parts[0], parts[1]);
  if(parts.length < 2) document.title = METATITLE;
}
function pageRow(f, p){ return `<a class="card" href="${lnk(f,p)}">📄 <b>${esc(pname(p))}</b><small>${esc(f)}</small></a>`; }
function folderCard(f){ const n = pagesOf(f).length; return `<a class="card folder" href="${lnk(f)}"><span class="em">📁</span><b>${esc(f)}</b><small>${n} page${n===1?'':'s'}</small></a>`; }
function viewHome(q){
  const names = Object.keys(tree.folders).sort(ci);
  let h = '<div class="crumb">🏠 Home</div>';
  if(q){
    const fs = names.filter(f => f.includes(q));
    const ps = []; names.forEach(f => pagesOf(f).forEach(p => { if((f+' '+pname(p)).toLowerCase().includes(q)) ps.push([f,p]); }));
    h += `<h2>Search “${esc(q)}”</h2>`;
    if(fs.length) h += `<div class="grid">${fs.map(folderCard).join('')}</div><br>`;
    if(ps.length) h += `<div class="list">${ps.map(([f,p])=>pageRow(f,p)).join('')}</div>`;
    if(!fs.length && !ps.length) h += '<div class="empty">Nothing found 🌸</div>';
    return h;
  }
  return h + (names.length ? `<div class="grid">${names.map(folderCard).join('')}</div>` : '<div class="empty">No folders yet 🌸</div>');
}
function viewFolder(f, q){
  if(!tree.folders[f]) return `<div class="crumb"><a href="#/">Home</a> › ${esc(f)}</div><div class="empty">Folder not found 🙈</div>`;
  const ps = pagesOf(f).filter(p => !q || pname(p).toLowerCase().includes(q)).sort(ci);
  return `<div class="crumb"><a href="#/">Home</a> › ${esc(f)}</div><h2>📁 ${esc(f)}</h2>` +
    (ps.length ? `<div class="list">${ps.map(p=>pageRow(f,p)).join('')}</div>` : '<div class="empty">No pages here yet 🌸</div>');
}
async function viewPage(f, file){
  const v = $('#visitor'), name = pname(file);
  const crumb = `<div class="crumb"><a href="#/">Home</a> › <a href="${lnk(f)}">${esc(f)}</a> › ${esc(name)}</div>`;
  v.innerHTML = crumb + '<div class="doc">Loading…</div>';
  const path = encodeURIComponent(f) + '/' + encodeURIComponent(file);
  try{
    const r = await fetch(path + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const m = doc.querySelector('main#content') || doc.body;
    m.querySelectorAll('script').forEach(s => s.remove());
    m.querySelectorAll('img').forEach(i => { const s = i.getAttribute('src')||''; if(s.startsWith('../')) i.setAttribute('src', s.slice(3)); });
    v.innerHTML = crumb + `<article class="doc">${m.innerHTML}</article><p class="crumb"><a target="_blank" rel="noopener" href="${path}">Open standalone page ↗</a> · <a target="_blank" rel="noopener" href="${SERVER}/${path}">Primary site ↗</a></p>`;
    document.title = `${name} - ${f} | ${METATITLE}`;
    scrollTo(0,0);
  }catch(e){
    v.innerHTML = crumb + `<div class="empty">This page is not on the mirror yet 🙈<br><small>The mirror syncs from the primary site every few minutes. <a target="_blank" rel="noopener" href="${SERVER}/${path}">Open it on the primary site ↗</a></small></div>`;
  }
}

$('#logo').onclick = () => { $('#search').value = ''; location.hash = '#/'; route(); };
$('#search').addEventListener('input', () => { if(hashParts().length > 1) location.hash = '#/'; else route(); });
addEventListener('hashchange', route);
loadTree().then(route);
})();
</script>
</body>
</html>
